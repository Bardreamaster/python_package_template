name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0

    - name: Install dependencies
      run: uv sync

    - name: Lint
      run: uv run ruff check

    - name: Check formatting
      run: uv run ruff format --check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The first version must be the same as requires-python in pyproject.toml.
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      # Codecov is optional. Without this secret, the upload steps do not run.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.4.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Run tests with coverage
      run: |
        uv run pytest \
          --cov=src/ \
          --cov-branch \
          --cov-report=xml \
          --junitxml=junit.xml \
          -o junit_family=legacy

    - name: Upload coverage reports to Codecov
      if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ env.CODECOV_TOKEN }}
        files: coverage.xml

    - name: Upload test results to Codecov
      if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ env.CODECOV_TOKEN }}
        files: junit.xml
        report_type: test_results

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          junit.xml
          coverage.xml

  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0

    - name: Install dependencies
      run: uv sync

    - name: Build documentation
      run: uv run python docs/build_docs.py --strict
