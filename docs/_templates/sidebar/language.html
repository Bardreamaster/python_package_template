{# Link to the same page in the other language. The two source trees have the same structure. #}
<div class="sidebar-language" style="padding: 0 var(--sidebar-item-spacing-horizontal); font-size: var(--sidebar-item-font-size);">
  <a href="{{ content_root }}../{{ other_language }}/{{ pagename }}.html" hreflang="{{ other_language }}">{{ other_language_name }}</a>
</div>
